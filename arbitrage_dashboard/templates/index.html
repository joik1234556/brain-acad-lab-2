{% extends 'base.html' %}
{% block title %}Arbitrage Dashboard{% endblock %}

{% block content %}
<div id="errorBanner" class="alert alert-danger d-none" role="alert"></div>

<div class="row g-3 mb-3">
  <div class="col-12 col-xl-8">
    <div class="card shadow-sm h-100">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Поиск (начало тикера)</label>
            <input id="searchInput" class="form-control" placeholder="BTC" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Мин. объём 24h (USD)</label>
            <input id="minVolInput" class="form-control" placeholder="1m / 500k" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Мин. спред (%)</label>
            <input id="minSpreadInput" type="number" min="0" step="0.01" class="form-control" value="0" />
          </div>
          <div class="col-12 d-flex gap-2 flex-wrap">
            <div class="form-check form-check-inline">
              <input class="form-check-input exch-check" type="checkbox" value="MEXC" id="exMexc" checked>
              <label class="form-check-label" for="exMexc">MEXC</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input exch-check" type="checkbox" value="Bybit" id="exBybit" checked>
              <label class="form-check-label" for="exBybit">Bybit</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input exch-check" type="checkbox" value="BingX" id="exBingx" checked>
              <label class="form-check-label" for="exBingx">BingX</label>
            </div>
            <button id="resetFiltersBtn" class="btn btn-outline-secondary btn-sm ms-auto">Сбросить фильтры</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12 col-xl-4">
    <div class="card shadow-sm h-100">
      <div class="card-body">
        <h6 class="card-title">Статус</h6>
        <div class="small text-muted" id="statsText">Загрузка...</div>
        <hr>
        <button id="refreshNowBtn" class="btn btn-primary w-100">Обновить сейчас</button>
      </div>
    </div>
  </div>
</div>

<div class="card shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0" id="arbTable">
      <thead class="table-light sticky-top">
        <tr>
          <th class="sortable" data-sort="symbol">Symbol</th>
          <th class="sortable" data-sort="spread">Spread</th>
          <th class="sortable" data-sort="buy_ex">Buy</th>
          <th class="sortable" data-sort="sell_ex">Sell</th>
          <th class="sortable" data-sort="buy_ask">Buy Ask</th>
          <th class="sortable" data-sort="sell_bid">Sell Bid</th>
          <th class="sortable" data-sort="funding_spread">F Spread</th>
          <th>Funding ETA</th>
          <th class="sortable" data-sort="buy_vol">Vol Buy</th>
          <th class="sortable" data-sort="sell_vol">Vol Sell</th>
        </tr>
      </thead>
      <tbody id="arbTbody"></tbody>
    </table>
  </div>
</div>
{% endblock %}
