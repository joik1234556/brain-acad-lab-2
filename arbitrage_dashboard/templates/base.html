<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Arbitrage Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='css/main.css') }}" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar p-3">
      <div class="brand mb-4">
        <div class="brand-dot"></div>
        <div>
          <h1 class="h5 m-0">Arbitrage UI</h1>
          <small class="text-muted">FastAPI Dashboard</small>
        </div>
      </div>
      {% include 'components/sidebar.html' %}
    </aside>

    <div class="main-wrap">
      <header class="topbar px-3 py-2">
        {% include 'components/header.html' %}
      </header>
      <main class="content p-3">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script type="module" src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
